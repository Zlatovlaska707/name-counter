name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.22.x"
  IMAGE_NAME: 'name-counter'
  GOVULNCHECK_VERSION: v1.3.0
  GOLANGCI_LINT_VERSION: v1.62.2

jobs:
  lint-code:
    name: Линтеры и проверка кода
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod
          if [ -f go.sum ]; then git diff --exit-code go.sum; fi

      - name: go fmt ./...
        run: |
          go fmt ./...
          git diff --exit-code

      - name: go vet ./...
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m --enable=typecheck ./...

  test:
    name: Тесты
    runs-on: ubuntu-latest
    needs: [lint-code]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: go test
        run: go test -v -race -cover -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generating a coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Saving report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  build:
    name: Сборка приложения
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        goos: [linux, windows, darwin]
        goarch: [amd64]
        exclude:
          - os: windows-latest
            goos: darwin
          - os: macos-latest
            goos: windows
          - os: ubuntu-latest
            goos: windows
          - os: ubuntu-latest
            goos: darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ИСПРАВЛЕНО: правильный путь к основной утилите
      - name: Building name-counter
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o bin/name-counter ./cmd/run

      # ИСПРАВЛЕНО: правильный путь к генератору тестовых данных
      - name: Building a data generator
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o bin/data-generator ./tools/genlarge

      - name: Saving Linux binaries
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-amd64
          path: bin/

      - name: Saving Windows binaries
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows-amd64
          path: bin/

      - name: Saving macOS binaries
        if: matrix.goos == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: binary-darwin-amd64
          path: bin/

  image:
    name: Сборка Docker образа
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сборка Docker образа
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}

      - name: Проверка Docker образа
        run: docker run --rm ${{ env.IMAGE_NAME }}:latest --help

      - name: Сохранение Docker образа
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > name-counter-image.tar.gz

      - name: Сохранение образа как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: name-counter-image.tar.gz